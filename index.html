<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Data Center IEC Cooling Designer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:40px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.section{
background:#f9fbff;
padding:20px;
border-radius:8px;
}

label{
display:block;
margin-top:10px;
}

input,select{
padding:6px;
margin-left:10px;
}

button{
margin-top:20px;
padding:10px 25px;
background:#007bff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.results{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:30px;
}

.card{
background:#f0f4ff;
padding:15px;
border-radius:8px;
text-align:center;
}

.value{
font-size:22px;
font-weight:bold;
}

.summary{
margin-top:25px;
background:#eef6ff;
padding:20px;
border-radius:8px;
}

.chart-container{
margin-top:40px;
}

</style>

</head>

<body>

<div class="container">

<h1>Data Center IEC Cooling Design Tool</h1>

<div class="grid">

<div class="section">

<h3>City Climate</h3>

<select id="city" onchange="loadCity()">

<option value="custom">Custom</option>
<option value="london">London</option>
<option value="birmingham">Birmingham</option>
<option value="dubai">Dubai</option>
<option value="singapore">Singapore</option>

</select>

<label>
Dry Bulb (°C)
<input id="dryBulb" value="32">
</label>

<label>
Relative Humidity (%)
<input id="humidity" value="40">
</label>

</div>

<div class="section">

<h3>Data Center</h3>

<label>
Rack Number
<input id="rackNumber" value="100">
</label>

<label>
Rack Power (kW)
<input id="rackPower" value="10">
</label>

<label>
Return Air Temp (°C)
<input id="returnTemp" value="35">
</label>

<label>
IEC Efficiency
<input id="efficiency" value="0.7">
</label>

<button onclick="calculate()">Calculate</button>

</div>

</div>

<div class="results">

<div class="card">
IT Load
<div class="value" id="itLoad">-</div>
</div>

<div class="card">
Wet Bulb
<div class="value" id="wetBulb">-</div>
</div>

<div class="card">
Supply Temp
<div class="value" id="supplyTemp">-</div>
</div>

<div class="card">
Airflow
<div class="value" id="airflow">-</div>
</div>

<div class="card">
Water Use
<div class="value" id="waterUse">-</div>
</div>

<div class="card">
PUE
<div class="value" id="pue">-</div>
</div>

<div class="card">
HX Area
<div class="value" id="hxArea">-</div>
</div>

<div class="card">
HX Face Area
<div class="value" id="hxFace">-</div>
</div>

</div>

<div class="summary">

<h3>Engineering Assessment</h3>

<p id="summaryText">

Run calculation to see system assessment.

</p>

</div>

<div class="chart-container">

<canvas id="effChart"></canvas>

</div>

<div class="chart-container">

<canvas id="airChart"></canvas>

</div>

</div>

<script>

function loadCity(){

let city=document.getElementById("city").value;

if(city=="london"){
dryBulb.value=28;
humidity.value=50;
}

if(city=="birmingham"){
dryBulb.value=27;
humidity.value=55;
}

if(city=="dubai"){
dryBulb.value=42;
humidity.value=25;
}

if(city=="singapore"){
dryBulb.value=33;
humidity.value=75;
}

}

function wetBulbTemp(T,RH){

let twb =
T*Math.atan(0.151977*Math.sqrt(RH+8.313659))+
Math.atan(T+RH)-
Math.atan(RH-1.676331)+
0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH)-
4.686035;

return twb;

}

function heatExchangerDesign(loadKW,airflow){

let Q=loadKW*1000;

let U=40;

let dT=8;

let area=Q/(U*dT);

let faceVelocity=2.5;

let faceArea=airflow/faceVelocity;

return{area:area,faceArea:faceArea};

}

function calculate(){

let racks=parseFloat(document.getElementById("rackNumber").value);
let rackPower=parseFloat(document.getElementById("rackPower").value);
let returnTemp=parseFloat(document.getElementById("returnTemp").value);

let Tdb=parseFloat(document.getElementById("dryBulb").value);
let RH=parseFloat(document.getElementById("humidity").value);

let efficiency=parseFloat(document.getElementById("efficiency").value);

if(RH>100||RH<0){
alert("Humidity must be 0-100%");
return;
}

if(efficiency>1||efficiency<0){
alert("Efficiency must be 0-1");
return;
}

let itLoad=racks*rackPower;

let Twb=wetBulbTemp(Tdb,RH);

let supply=Tdb-efficiency*(Tdb-Twb);

let airflow=(itLoad*1000)/(1.2*1005*(returnTemp-supply));

let water=(itLoad*1000)/2450000*3600/1000;

let fanPower=airflow*0.8;

let pue=(itLoad+fanPower)/itLoad;

let hx=heatExchangerDesign(itLoad,airflow);

document.getElementById("itLoad").innerText=itLoad.toFixed(1)+" kW";
document.getElementById("wetBulb").innerText=Twb.toFixed(1)+" °C";
document.getElementById("supplyTemp").innerText=supply.toFixed(1)+" °C";
document.getElementById("airflow").innerText=airflow.toFixed(1)+" m³/s";
document.getElementById("waterUse").innerText=water.toFixed(2)+" m³/h";
document.getElementById("pue").innerText=pue.toFixed(2);

document.getElementById("hxArea").innerText=hx.area.toFixed(0)+" m²";
document.getElementById("hxFace").innerText=hx.faceArea.toFixed(1)+" m²";

let mode="";

if(supply<=27){

mode="IEC cooling alone can meet server inlet temperature.";

}else{

mode="Mechanical cooling assist required.";

}

document.getElementById("summaryText").innerText=
"Supply air temperature "+supply.toFixed(1)+"°C. "+
mode+
" Estimated airflow "+airflow.toFixed(1)+" m³/s. "+
"Heat exchanger area "+hx.area.toFixed(0)+" m².";

drawCharts(Tdb,Twb,itLoad);

}

function drawCharts(Tdb,Twb,itLoad){

let eff=[];
let temp=[];

for(let e=0.4;e<=0.9;e+=0.05){

eff.push(e.toFixed(2));

temp.push(Tdb-e*(Tdb-Twb));

}

new Chart(document.getElementById("effChart"),{

type:"line",

data:{
labels:eff,
datasets:[{
label:"Supply Temp vs IEC Efficiency",
data:temp,
borderColor:"blue"
}]
}

});

let load=[];
let airflow=[];

for(let L=200;L<=2000;L+=200){

load.push(L);

airflow.push((L*1000)/(1.2*1005*10));

}

new Chart(document.getElementById("airChart"),{

type:"line",

data:{
labels:load,
datasets:[{
label:"Airflow vs IT Load",
data:airflow,
borderColor:"green"
}]
}

});

}

</script>

</body>

</html>
