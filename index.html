<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Data Center IEC Cooling Designer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:40px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.section{
background:#f9fbff;
padding:20px;
border-radius:8px;
}

label{
display:block;
margin-top:10px;
}

input,select{
padding:6px;
margin-left:10px;
}

button{
margin-top:20px;
padding:10px 25px;
background:#007bff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.results{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.card{
background:#f0f4ff;
padding:15px;
border-radius:8px;
text-align:center;
}

.value{
font-size:22px;
font-weight:bold;
}

.summary{
margin-top:25px;
background:#eef6ff;
padding:20px;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>Data Center IEC Cooling Design Tool</h1>

<div class="grid">

<div class="section">

<h3>City Climate</h3>

<select id="city">

<option value="custom">Custom</option>
<option value="london">London</option>
<option value="birmingham">Birmingham</option>
<option value="dubai">Dubai</option>
<option value="singapore">Singapore</option>

</select>

<label>
Dry Bulb (°C)
<input id="dryBulb" value="32">
</label>

<label>
Relative Humidity (%)
<input id="humidity" value="40">
</label>

</div>

<div class="section">

<h3>Data Center</h3>

<label>
Rack Number
<input id="rackNumber" value="100">
</label>

<label>
Rack Power (kW)
<input id="rackPower" value="10">
</label>

<label>
Return Air Temp (°C)
<input id="returnTemp" value="35">
</label>

<label>
IEC Efficiency
<input id="efficiency" value="0.7">
</label>

<button onclick="calculate()">Calculate</button>

</div>

</div>

<div class="results">

<div class="card">
IT Load
<div class="value" id="itLoad">-</div>
</div>

<div class="card">
Wet Bulb Temp
<div class="value" id="wetBulb">-</div>
</div>

<div class="card">
Supply Temp
<div class="value" id="supplyTemp">-</div>
</div>

<div class="card">
Airflow
<div class="value" id="airflow">-</div>
</div>

<div class="card">
Water Use
<div class="value" id="waterUse">-</div>
</div>

<div class="card">
PUE
<div class="value" id="pue">-</div>
</div>

</div>

<div class="summary">

<h3>Engineering Assessment</h3>

<p id="summaryText">

Run calculation to see system assessment.

</p>

</div>

<canvas id="chart" height="100"></canvas>

</div>

<script>

function wetBulbTemp(T,RH){

let twb =
T*Math.atan(0.151977*Math.sqrt(RH+8.313659))+
Math.atan(T+RH)-
Math.atan(RH-1.676331)+
0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH)-
4.686035;

return twb;

}

function calculate(){

let racks = parseFloat(document.getElementById("rackNumber").value);
let rackPower = parseFloat(document.getElementById("rackPower").value);
let returnTemp = parseFloat(document.getElementById("returnTemp").value);

let Tdb = parseFloat(document.getElementById("dryBulb").value);
let RH = parseFloat(document.getElementById("humidity").value);

let efficiency = parseFloat(document.getElementById("efficiency").value);

if(RH>100 || RH<0){
alert("Relative humidity must be between 0 and 100%");
return;
}

if(efficiency>1 || efficiency<0){
alert("IEC efficiency must be between 0 and 1");
return;
}

let itLoad = racks * rackPower;

let Twb = wetBulbTemp(Tdb,RH);

let supplyTemp = Tdb - efficiency*(Tdb - Twb);

let airflow = (itLoad*1000)/(1.2*1005*(returnTemp - supplyTemp));

let waterUse = (itLoad*1000)/2450000*3600/1000;

let fanPower = airflow*0.8;

let pue = (itLoad + fanPower)/itLoad;

document.getElementById("itLoad").innerText = itLoad.toFixed(1)+" kW";
document.getElementById("wetBulb").innerText = Twb.toFixed(1)+" °C";
document.getElementById("supplyTemp").innerText = supplyTemp.toFixed(1)+" °C";
document.getElementById("airflow").innerText = airflow.toFixed(1)+" m³/s";
document.getElementById("waterUse").innerText = waterUse.toFixed(2)+" m³/h";
document.getElementById("pue").innerText = pue.toFixed(2);

let mode = "";

if(supplyTemp <= 27){

mode = "IEC cooling alone can meet the server inlet temperature requirement.";

}else{

mode = "Supply temperature exceeds recommended server inlet temperature. Mechanical cooling assist may be required.";

}

document.getElementById("summaryText").innerText =
"Calculated supply air temperature is "+supplyTemp.toFixed(1)+" °C. "+
mode+
" Estimated airflow is "+airflow.toFixed(1)+" m³/s.";

drawChart(Tdb,Twb);

}

function drawChart(Tdb,Twb){

let effs=[];
let temps=[];

for(let e=0.4;e<=0.9;e+=0.05){

effs.push(e.toFixed(2));

temps.push(Tdb - e*(Tdb-Twb));

}

new Chart(document.getElementById("chart"),{

type:"line",

data:{

labels:effs,

datasets:[{

label:"Supply Temperature vs IEC Efficiency",

data:temps,

borderColor:"blue",

fill:false

}]

}

});

}

</script>

</body>

</html>
