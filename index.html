<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>IEC Data Center Cooling Designer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:40px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.section{
background:#f9fbff;
padding:20px;
border-radius:8px;
}

label{
display:block;
margin-top:10px;
}

input,select{
padding:6px;
margin-left:10px;
}

button{
margin-top:20px;
padding:10px 25px;
background:#007bff;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

.results{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.card{
background:#f0f4ff;
padding:15px;
border-radius:8px;
text-align:center;
}

.value{
font-size:22px;
font-weight:bold;
}

.summary{
margin-top:25px;
background:#eef6ff;
padding:20px;
border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

<h1>Data Center IEC Cooling Design Tool</h1>

<div class="grid">

<div class="section">

<h3>City Climate</h3>

<select id="city" onchange="loadCity()">
<option value="custom">Custom</option>
<option value="london">London</option>
<option value="birmingham">Birmingham</option>
<option value="dubai">Dubai</option>
<option value="singapore">Singapore</option>
</select>

<label>Dry Bulb (°C)
<input id="dryBulb" value="32">
</label>

<label>Relative Humidity (%)
<input id="humidity" value="40">
</label>

</div>

<div class="section">

<h3>Data Center</h3>

<label>Rack Number
<input id="rackNumber" value="100">
</label>

<label>Rack Power (kW)
<input id="rackPower" value="10">
</label>

<label>Return Air Temp (°C)
<input id="returnTemp" value="35">
</label>

<label>IEC Efficiency
<input id="efficiency" value="0.7">
</label>

<button onclick="calculate()">Calculate</button>

</div>

</div>

<div class="results">

<div class="card">
IT Load
<div class="value" id="itLoad">-</div>
</div>

<div class="card">
Wet Bulb Temp
<div class="value" id="wetBulb">-</div>
</div>

<div class="card">
Supply Temp
<div class="value" id="supplyTemp">-</div>
</div>

<div class="card">
Airflow
<div class="value" id="airflow">-</div>
</div>

<div class="card">
Water Use
<div class="value" id="waterUse">-</div>
</div>

<div class="card">
PUE
<div class="value" id="pue">-</div>
</div>

</div>

<div class="summary">

<h3>Engineering Assessment</h3>

<p id="summaryText">Run calculation to see system assessment.</p>

</div>

<canvas id="chart" height="100"></canvas>

</div>

<script>

function loadCity(){

let city=document.getElementById("city").value;

if(city=="london"){
dryBulb.value=28;
humidity.value=50;
}

if(city=="birmingham"){
dryBulb.value=27;
humidity.value=55;
}

if(city=="dubai"){
dryBulb.value=42;
humidity.value=25;
}

if(city=="singapore"){
dryBulb.value=33;
humidity.value=75;
}

}

function wetBulbTemp(T,RH){

let twb =
T*Math.atan(0.151977*Math.sqrt(RH+8.313659))+
Math.atan(T+RH)-
Math.atan(RH-1.676331)+
0.00391838*Math.pow(RH,1.5)*Math.atan(0.023101*RH)-
4.686035;

return twb;

}

function calculate(){

let racks=parseFloat(rackNumber.value);
let rackPower=parseFloat(rackPower.value);
let returnTemp=parseFloat(returnTemp.value);

let Tdb=parseFloat(dryBulb.value);
let RH=parseFloat(humidity.value);

let efficiency=parseFloat(efficiency.value);

if(RH>100||RH<0){
alert("Humidity must be 0-100%");
return;
}

if(efficiency>1||efficiency<0){
alert("Efficiency must be 0-1");
return;
}

let itLoad=racks*rackPower;

let Twb=wetBulbTemp(Tdb,RH);

let supply=Tdb-efficiency*(Tdb-Twb);

let airflow=(itLoad*1000)/(1.2*1005*(returnTemp-supply));

let water=(itLoad*1000)/2450000*3600/1000;

let fanPower=airflow*0.8;

let pue=(itLoad+fanPower)/itLoad;

itLoad.innerText=itLoad.toFixed(1)+" kW";
wetBulb.innerText=Twb.toFixed(1)+" °C";
supplyTemp.innerText=supply.toFixed(1)+" °C";
airflow.innerText=airflow.toFixed(1)+" m³/s";
waterUse.innerText=water.toFixed(2)+" m³/h";
pue.innerText=pue.toFixed(2);

let mode="";

if(supply<=27){
mode="IEC alone can meet cooling demand.";
}else{
mode="Mechanical cooling assist required.";
}

summaryText.innerText=
"Supply temperature is "+supply.toFixed(1)+"°C. "+
mode+
" Estimated airflow "+airflow.toFixed(1)+" m³/s.";

drawChart(efficiency,Tdb,Twb);

}

function drawChart(eff,Tdb,Twb){

let effs=[];
let temps=[];

for(let e=0.4;e<=0.9;e+=0.05){

effs.push(e.toFixed(2));
temps.push(Tdb-e*(Tdb-Twb));

}

new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:effs,
datasets:[{
label:"Supply Temperature vs Efficiency",
data:temps,
borderColor:"blue",
fill:false
}]
}

});

}

</script>

</body>
</html>
